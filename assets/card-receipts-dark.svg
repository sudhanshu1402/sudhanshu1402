<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150" role="img" aria-label="receipts. Checks what an agent claimed against what its own transcript shows. Unbacked claims get flagged. npm  ·  Claude Code plugin">
  <title>receipts</title>
  <style>
    .m { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    .t { font-size: 15px; font-weight: 600; fill: #ff7b72; }
    .d { font-size: 11px; fill: #8b949e; }
    .f { font-size: 10px; fill: #6e7681; }
  </style>
  <defs><clipPath id="c"><rect x="0" y="0" width="300" height="150" rx="10" /></clipPath></defs>
  <rect x="0.5" y="0.5" width="299" height="149" rx="10" fill="#0d1117" stroke="#30363d" />
  <rect clip-path="url(#c)" x="0" y="0" width="300" height="4" fill="#ff7b72" />
  <text class="m t" x="20" y="42">receipts</text>
  <text class="m d" x="20" y="70">Checks what an agent claimed</text>
  <text class="m d" x="20" y="88">against its own transcript. Unbacked</text>
  <text class="m d" x="20" y="106">claims get flagged, not trusted.</text>
  <text class="m f" x="20" y="132">npm  ·  Claude Code plugin</text>
</svg>
