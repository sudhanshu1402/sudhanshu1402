<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="The Crash Report, a journal by Sudhanshu Singh, backend developer. Headline: Systems that stay correct after they crash. Lead case: keel. The process died after the card was charged. On restart, charge and reserve replayed from disk and ship ran once. The card was charged exactly once." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.se{font-family:Georgia,"Times New Roman",serif}.sa{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.in{}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.st{}@keyframes dr{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.in{opacity:1;animation:none}.st{stroke-dashoffset:0;animation:none}}
</style>
<rect width="1200" height="560" fill="#f3efe6"/>
<rect x="24" y="24" width="1152" height="512" fill="none" stroke="#141414" stroke-width="2"/>
<text x="52" y="66" class="sa" font-size="13" letter-spacing="3" fill="#141414">VOL. 1 · SUDHANSHU SINGH · BACKEND DEVELOPER</text>
<text x="1148" y="66" text-anchor="end" class="sa" font-size="13" letter-spacing="3" fill="#141414">OPEN TO BACKEND &amp; PLATFORM ROLES</text>
<line x1="52" x2="1148" y1="82" y2="82" stroke="#141414"/>
<text x="600" y="164" text-anchor="middle" class="se in" font-size="84" font-weight="700" fill="#141414" style="animation-delay:.1s">The Crash Report</text>
<text x="600" y="200" text-anchor="middle" class="se in" font-size="20" font-style="italic" fill="#4a4a4a" style="animation-delay:.3s">by Sudhanshu Singh, on systems that stay correct after they crash</text>
<line x1="52" x2="1148" y1="226" y2="226" stroke="#141414" stroke-width="3"/><line x1="52" x2="1148" y1="232" y2="232" stroke="#141414"/>
<text x="52" y="276" class="sa in" font-size="12" letter-spacing="3" fill="#ff4d2e" style="animation-delay:.6s">LEAD CASE · KEEL</text>
<text x="52" y="322" class="se in" font-size="38" font-weight="700" fill="#141414" style="animation-delay:.7s">Process dies after the charge.</text>
<text x="52" y="368" class="se in" font-size="38" font-weight="700" fill="#141414" style="animation-delay:.9s">Card charged <tspan fill="#ff4d2e">exactly once.</tspan></text>
<path class="st" d="M300 378 q110 10 220 -2" stroke="#ff4d2e" stroke-width="4" fill="none" stroke-linecap="round"/>
<text x="52" y="420" class="se in" font-size="18" fill="#333" style="animation-delay:1.1s">Every step is journaled to disk. On restart, finished steps replay</text>
<text x="52" y="446" class="se in" font-size="18" fill="#333" style="animation-delay:1.1s">instead of re-running, so nothing is paid for twice.</text>
<line x1="700" x2="700" y1="256" y2="500" stroke="#141414"/>
<text x="730" y="276" class="sa in" font-size="12" letter-spacing="3" fill="#141414" style="animation-delay:1.2s">THE RECORD</text>
<g class="mo" font-size="16"><text y="318" class="in" style="animation-delay:1.4s" fill="#141414"><tspan x="730">run 1</tspan><tspan x="810">charge</tspan><tspan x="920"><tspan fill="#1f7a3a">■ saved</tspan></tspan></text><text y="348" class="in" style="animation-delay:1.7s" fill="#141414"><tspan x="730"></tspan><tspan x="810">reserve</tspan><tspan x="920"><tspan fill="#1f7a3a">■ saved</tspan></tspan></text><text y="378" class="in" style="animation-delay:2.1s" fill="#141414"><tspan x="730"></tspan><tspan x="810">ship</tspan><tspan x="920"><tspan fill="#ff4d2e">✕ killed</tspan></tspan></text><text y="422" class="in" style="animation-delay:2.7s" fill="#141414"><tspan x="730">run 2</tspan><tspan x="810">charge</tspan><tspan x="920"><tspan fill="#8a8a8a">↺ replayed</tspan></tspan></text><text y="452" class="in" style="animation-delay:3.0s" fill="#141414"><tspan x="730"></tspan><tspan x="810">reserve</tspan><tspan x="920"><tspan fill="#8a8a8a">↺ replayed</tspan></tspan></text><text y="482" class="in" style="animation-delay:3.4s" fill="#141414"><tspan x="730"></tspan><tspan x="810">ship</tspan><tspan x="920"><tspan fill="#1f7a3a">■ done</tspan></tspan></text></g>
<text x="52" y="512" class="sa" font-size="12" letter-spacing="2" fill="#6b6b6b">ALSO IN THIS ISSUE, BELOW: NOCAP · RECEIPTS · AUTH · QUEUES · RESIDENCY · TRACING · LLM OUTPUT</text>
</svg>
